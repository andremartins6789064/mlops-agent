[project]
name = "mlops-agent"
version = "0.1.0"
description = "AI agent for converting Jupyter Notebooks into production ML pipelines"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
"openai>=1.50.0",
"openai-agents>=0.0.5",
"nbformat>=5.10.0",
"streamlit>=1.40.0",
"pydantic>=2.0.0",
"pydantic-settings>=2.0.0",
"python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
"pytest>=8.0.0",
"pytest-cov>=5.0.0",
"pytest-asyncio>=0.23.0",
"ruff>=0.6.0",
"mypy>=1.11.0",
"pre-commit>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
markers = [
"integration: tests that require external services such as Ollama",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/ui/pages/*.py" = ["N999"]
"src/ui/app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
